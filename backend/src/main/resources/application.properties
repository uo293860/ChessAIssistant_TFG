spring.application.name=tfg

ai.provider=${AI_PROVIDER:gemini}
gemini.api.key=${GEMINI_API_KEY:}
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434/api/generate}
ollama.model=${OLLAMA_MODEL:gemma4:e4b}
firebase.config.path=${FIREBASE_CONFIG_PATH:chessaissistant-1ea8f-firebase-adminsdk-fbsvc-40f460c561.json}

# Database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chessai_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Hibernate
# 'update' creates or updates tables automatically from the Java entities.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
